name: MCP Registry

# Validates server.json on every pull request. On main it publishes server.json
# to the Official MCP Registry (registry.modelcontextprotocol.io) when that
# version is not there yet, then applies the version statuses in
# registry-status.json.
#
# Publishing uses GitHub Actions OIDC. The registry grants a workflow in a
# nansen-ai repository the io.github.nansen-ai/* namespace, so no personal
# token or org Owner login is needed.

on:
  pull_request:
    paths:
      - server.json
      - registry-status.json
      - .github/workflows/publish-mcp-registry.yml
  push:
    branches: [main]
    paths:
      - server.json
      - registry-status.json
      - .github/workflows/publish-mcp-registry.yml
  workflow_dispatch:

concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.8
  REGISTRY_URL: https://registry.modelcontextprotocol.io

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Check registry-status.json
        run: jq -e '.deprecated | type == "object"' registry-status.json

      - name: Log in to the MCP Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json if this version is new
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          encoded="$(jq -rn --arg n "$name" '$n|@uri')"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$REGISTRY_URL/v0/servers/$encoded/versions/$version")"
          if [ "$code" = "200" ]; then
            echo "$name $version is already published; skipping."
          elif [ "$code" = "404" ]; then
            ./mcp-publisher publish server.json
          else
            echo "Unexpected HTTP $code from the registry" >&2
            exit 1
          fi

      - name: Apply version statuses
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          encoded="$(jq -rn --arg n "$name" '$n|@uri')"
          jq -r '.deprecated | to_entries[] | [.key, .value] | @tsv' registry-status.json |
          while IFS=$'\t' read -r version message; do
            status="$(curl --fail --silent --show-error "$REGISTRY_URL/v0/servers/$encoded/versions/$version" \
              | jq -r '._meta["io.modelcontextprotocol.registry/official"].status')"
            if [ "$status" = "deprecated" ]; then
              echo "$name $version is already deprecated."
            else
              ./mcp-publisher status --status deprecated --message "$message" "$name" "$version"
            fi
          done
